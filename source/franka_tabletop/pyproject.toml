[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franka_tabletop"
version = "0.1.0"
description = "Franka arm with a 2F-85 gripper on a tabletop benchmark."
authors = [{ name = "Nepher Robotics" }]
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
    # moviepy 2 removed moviepy.editor, which write_clip imports.
    "moviepy>=1.0.3,<2",
]

[project.entry-points."isaaclab.tasks"]
franka_tabletop = "franka_tabletop.tasks"

[tool.setuptools.packages.find]
where = ["."]
include = ["franka_tabletop*"]

[tool.setuptools.package-data]
franka_tabletop = ["assets/robots/*"]
